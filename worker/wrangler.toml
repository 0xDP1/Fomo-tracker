# Discord feed Worker (also forwards a few read-only GMGN calls). Kept in step with the deployed Worker.
# Secrets are NOT set here — set them in the dashboard (Settings → Variables and Secrets, type Secret) or run:
#   npx wrangler secret put DISCORD_TOKEN
#   npx wrangler secret put FEED_KEY
#   npx wrangler secret put GMGN_API_KEY     (optional: Early traders and GMGN creator history)
#   npx wrangler secret put TG_BOT_TOKEN     (optional: alerts on Telegram while the app is closed, see README)
name = "fomo-discord-feed"
main = "index.mjs"
compatibility_date = "2026-09-01"

# The schedule prices the last day's calls every 5 minutes and messages the Telegram bot on 2×, 4× and big moves
# (worker/alerts-core.js). It writes storage only when a peak or alert changed, so it fits the free plan's
# 1,000 writes a day. Without TG_BOT_TOKEN the schedule only reads the channels.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Up to 10 channels, each `id` or `id:label`, separated by commas, e.g. "111:first scan,222:price move"
CHANNEL_ID = "PUT_CHANNEL_IDS_HERE"
# Optional: the channel "What people are saying" searches (read on request only, never stored).
CHATTER_CHANNEL = "PUT_CHATTER_CHANNEL_ID_HERE"
ALLOWED_ORIGIN = "https://0xdp1.github.io"
# Optional Telegram groups, read by your Telegram reader on Vercel (telegram-proxy/). Also: npx wrangler secret put TG_PROXY_KEY
# TG_PROXY_URL = "https://<your project>.vercel.app"
# TG_CHAT = "channel:<id>:<access hash>:<label>"

[[kv_namespaces]]
binding = "CALLS"
id = "PUT_KV_NAMESPACE_ID_HERE"
